[project]
name = "securerag-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
  "pgvector>=0.3,<1",
  "argon2-cffi>=25,<26",
  "PyJWT>=2.10,<3",
  "email-validator>=2.2,<3",
  "python-multipart>=0.0.20,<1",
  "pypdf>=6.0,<7",
  "google-genai>=1.0,<3",
  "tzdata>=2025.1",
  "google-auth[requests]>=2.40,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".local"]
