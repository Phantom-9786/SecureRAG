user nginx;
worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    server_tokens off;
    limit_req_zone $binary_remote_addr zone=authentication:10m rate=10r/m;
    limit_req_status 429;
    # Do not log query strings, credentials, or request bodies.
    log_format safe '$remote_addr $request_method $uri $status $request_time';
    access_log /var/log/nginx/access.log safe;
    server {
        listen 80;
        client_max_body_size 64k;
        client_body_timeout 30s;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location = /api/v1/auth/login {
            limit_req zone=authentication burst=10 nodelay;
            client_max_body_size 32k;
            proxy_pass http://api:8000;
        }
        location = /api/v1/auth/google {
            limit_req zone=authentication burst=10 nodelay;
            client_max_body_size 32k;
            proxy_pass http://api:8000;
        }
        location = /api/v1/auth/google/challenge {
            limit_req zone=authentication burst=10 nodelay;
            proxy_pass http://api:8000;
        }
        location = /api/v1/admin/documents {
            client_max_body_size 26m;
            proxy_pass http://api:8000;
        }
        location /api/v1/ { proxy_pass http://api:8000; }
        location / { proxy_pass http://frontend:3000; }
    }
}
